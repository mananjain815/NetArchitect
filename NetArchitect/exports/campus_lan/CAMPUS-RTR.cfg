enable
configure terminal
hostname CAMPUS-RTR
!
! NetArchitect - CAMPUS router: routing, WAN links
! Replace every CHANGE_ME_BEFORE_DEPLOY value before production use.
!
no ip domain-lookup
service password-encryption
ip domain-name netarchitect.local
enable secret CHANGE_ME_BEFORE_DEPLOY
username netadmin privilege 15 secret CHANGE_ME_BEFORE_DEPLOY
crypto key generate rsa modulus 2048
ip ssh version 2
!
interface GigabitEthernet0/0
 description DOWNLINK-TO-CAMPUS-L3SW
 ip address 10.10.16.1 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
router ospf 1
 router-id 10.255.1.2
 auto-cost reference-bandwidth 10000
 network 10.10.16.1 0.0.0.0 area 0
!
line console 0
 logging synchronous
 exec-timeout 10 0
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
write memory
