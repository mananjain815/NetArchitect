enable
configure terminal
hostname CAMPUS-ACCESS-SW1
!
! NetArchitect - CAMPUS access switch (template - replicate per closet): RSTP, port security
! Replace every CHANGE_ME_BEFORE_DEPLOY value before production use.
!
no ip domain-lookup
service password-encryption
ip domain-name netarchitect.local
enable secret CHANGE_ME_BEFORE_DEPLOY
username netadmin privilege 15 secret CHANGE_ME_BEFORE_DEPLOY
crypto key generate rsa modulus 2048
ip ssh version 2
!
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
!
vlan 999
 name NATIVE_UNUSED
vlan 10
 name STUDENTS
vlan 20
 name FACULTY
vlan 30
 name STAFF_ADMIN
vlan 40
 name IOT_AP
vlan 60
 name MGMT
!
interface range FastEthernet0/1 - 4
 description ACCESS-STUDENTS
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 no shutdown
!
interface range FastEthernet0/5 - 8
 description ACCESS-FACULTY
 switchport mode access
 switchport access vlan 20
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 no shutdown
!
interface range FastEthernet0/9 - 12
 description ACCESS-STAFF_ADMIN
 switchport mode access
 switchport access vlan 30
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 no shutdown
!
interface range FastEthernet0/13 - 16
 description ACCESS-IOT_AP
 switchport mode access
 switchport access vlan 40
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 no shutdown
!
interface range FastEthernet0/17 - 24
 description UNUSED-PARKED
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface GigabitEthernet0/1
 description TRUNK-TO-CAMPUS-L3SW
 switchport mode trunk
 switchport nonegotiate
 channel-group 1 mode active
 no shutdown
!
interface GigabitEthernet0/2
 description TRUNK-TO-CAMPUS-L3SW
 switchport mode trunk
 switchport nonegotiate
 channel-group 1 mode active
 no shutdown
!
interface Port-channel1
 description LACP-TRUNK-TO-L3SW
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,60
!
interface Vlan60
 description MANAGEMENT
 ip address 10.10.8.130 255.255.255.192
 no shutdown
ip default-gateway 10.10.8.129
!
line console 0
 logging synchronous
 exec-timeout 10 0
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
write memory
