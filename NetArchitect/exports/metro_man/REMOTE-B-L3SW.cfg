enable
configure terminal
hostname REMOTE-B-L3SW
!
! NetArchitect - REMOTE_B multilayer switch: SVIs, RSTP, DHCP, ACLs, OSPF
! Replace every CHANGE_ME_BEFORE_DEPLOY value before production use.
!
no ip domain-lookup
service password-encryption
ip domain-name netarchitect.local
enable secret CHANGE_ME_BEFORE_DEPLOY
username netadmin privilege 15 secret CHANGE_ME_BEFORE_DEPLOY
crypto key generate rsa modulus 2048
ip ssh version 2
!
ip routing
!
spanning-tree mode rapid-pvst
spanning-tree vlan 30 priority 4096
!
vlan 999
 name NATIVE_UNUSED
vlan 30
 name REMOTE_B_USERS
!
ip dhcp excluded-address 10.20.2.129 10.20.2.138
ip dhcp pool REMOTE_B_USERS
 network 10.20.2.128 255.255.255.128
 default-router 10.20.2.129
!
interface Vlan30
 description GW-REMOTE_B_USERS
 ip address 10.20.2.129 255.255.255.128
 ip access-group ACL-REMOTE_B_USERS-IN in
 no shutdown
!
interface GigabitEthernet0/1
 description UPLINK-TO-REMOTE-B-RTR
 no switchport
 ip address 10.20.3.10 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
! --- ACL definitions (applied inbound on each SVI above) ---
ip access-list extended ACL-REMOTE_B_USERS-IN
 remark NetArchitect policy: role=user subnet=10.20.2.128/25
 permit udp host 0.0.0.0 host 255.255.255.255 eq 67
 permit tcp 10.20.2.128 0.0.0.127 10.20.1.0 0.0.0.63 eq 80
 permit tcp 10.20.2.128 0.0.0.127 10.20.1.0 0.0.0.63 eq 443
 permit udp 10.20.2.128 0.0.0.127 10.20.1.0 0.0.0.63 eq 53
 permit icmp 10.20.2.128 0.0.0.127 10.20.1.0 0.0.0.63 echo
 deny ip 10.20.2.128 0.0.0.127 10.20.1.0 0.0.0.63
 deny ip 10.20.2.128 0.0.0.127 10.20.1.64 0.0.0.31
 permit ip 10.20.2.128 0.0.0.127 any
 deny ip any any
!
router ospf 1
 router-id 10.255.3.1
 passive-interface default
 no passive-interface GigabitEthernet0/1
 auto-cost reference-bandwidth 10000
 network 10.20.2.128 0.0.0.127 area 2
 network 10.20.3.10 0.0.0.0 area 2
!
line console 0
 logging synchronous
 exec-timeout 10 0
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
write memory
