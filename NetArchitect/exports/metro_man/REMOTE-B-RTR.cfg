enable
configure terminal
hostname REMOTE-B-RTR
!
! NetArchitect - REMOTE_B router: routing, WAN links, QoS
! Replace every CHANGE_ME_BEFORE_DEPLOY value before production use.
!
no ip domain-lookup
service password-encryption
ip domain-name netarchitect.local
enable secret CHANGE_ME_BEFORE_DEPLOY
username netadmin privilege 15 secret CHANGE_ME_BEFORE_DEPLOY
crypto key generate rsa modulus 2048
ip ssh version 2
!
interface GigabitEthernet0/0
 description DOWNLINK-TO-REMOTE-B-L3SW
 ip address 10.20.3.9 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
ip access-list extended QOS-CRITICAL
 permit ip any 10.20.1.0 0.0.0.63
 permit ip 10.20.1.0 0.0.0.63 any
class-map match-any VOICE
 match dscp ef
class-map match-any CRITICAL
 match access-group name QOS-CRITICAL
 match dscp af31 af41
policy-map WAN-QOS
 class VOICE
  priority percent 20
 class CRITICAL
  bandwidth percent 40
 class class-default
  fair-queue
!
interface GigabitEthernet0/1
 description EVPL-PHYSICAL-WAN_HQ_REMOTE_B_1
 no ip address
 service-policy output WAN-QOS
 no shutdown
!
interface GigabitEthernet0/1.205
 description EVPL-EVC-205-TO-HQ-RTR
 encapsulation dot1Q 205
 ip address 10.20.3.22 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet0/2
 description EVPL-PHYSICAL-WAN_HQ_REMOTE_B_2
 no ip address
 service-policy output WAN-QOS
 no shutdown
!
interface GigabitEthernet0/2.206
 description EVPL-EVC-206-TO-HQ-RTR
 encapsulation dot1Q 206
 ip address 10.20.3.26 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 100
 no shutdown
!
router ospf 1
 router-id 10.255.3.2
 auto-cost reference-bandwidth 10000
 network 10.20.3.9 0.0.0.0 area 2
 network 10.20.3.22 0.0.0.0 area 2
 network 10.20.3.26 0.0.0.0 area 2
!
line console 0
 logging synchronous
 exec-timeout 10 0
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
write memory
