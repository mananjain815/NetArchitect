enable
configure terminal
!
! NetArchitect inter-VLAN policy bundle (same ACLs are already inside the L3SW files).
! Apply with:  interface VlanX / ip access-group <name> in
ip access-list extended ACL-HQ_USERS-IN
 remark NetArchitect policy: role=user subnet=10.20.0.0/24
 permit udp host 0.0.0.0 host 255.255.255.255 eq 67
 permit tcp 10.20.0.0 0.0.0.255 10.20.1.0 0.0.0.63 eq 80
 permit tcp 10.20.0.0 0.0.0.255 10.20.1.0 0.0.0.63 eq 443
 permit udp 10.20.0.0 0.0.0.255 10.20.1.0 0.0.0.63 eq 53
 permit icmp 10.20.0.0 0.0.0.255 10.20.1.0 0.0.0.63 echo
 deny ip 10.20.0.0 0.0.0.255 10.20.1.0 0.0.0.63
 deny ip 10.20.0.0 0.0.0.255 10.20.1.64 0.0.0.31
 permit ip 10.20.0.0 0.0.0.255 any
 deny ip any any
ip access-list extended ACL-FINTECH_SERVERS-IN
 remark NetArchitect policy: role=server subnet=10.20.1.0/26
 permit tcp 10.20.1.0 0.0.0.63 any established
 permit udp 10.20.1.0 0.0.0.63 eq 53 any
 permit icmp 10.20.1.0 0.0.0.63 any echo-reply
 deny ip any any
ip access-list extended ACL-HQ_MGMT-IN
 remark NetArchitect policy: role=mgmt subnet=10.20.1.64/27
 permit ip 10.20.1.64 0.0.0.31 any
 deny ip any any
ip access-list extended ACL-REMOTE_A_USERS-IN
 remark NetArchitect policy: role=user subnet=10.20.2.0/25
 permit udp host 0.0.0.0 host 255.255.255.255 eq 67
 permit tcp 10.20.2.0 0.0.0.127 10.20.1.0 0.0.0.63 eq 80
 permit tcp 10.20.2.0 0.0.0.127 10.20.1.0 0.0.0.63 eq 443
 permit udp 10.20.2.0 0.0.0.127 10.20.1.0 0.0.0.63 eq 53
 permit icmp 10.20.2.0 0.0.0.127 10.20.1.0 0.0.0.63 echo
 deny ip 10.20.2.0 0.0.0.127 10.20.1.0 0.0.0.63
 deny ip 10.20.2.0 0.0.0.127 10.20.1.64 0.0.0.31
 permit ip 10.20.2.0 0.0.0.127 any
 deny ip any any
ip access-list extended ACL-REMOTE_B_USERS-IN
 remark NetArchitect policy: role=user subnet=10.20.2.128/25
 permit udp host 0.0.0.0 host 255.255.255.255 eq 67
 permit tcp 10.20.2.128 0.0.0.127 10.20.1.0 0.0.0.63 eq 80
 permit tcp 10.20.2.128 0.0.0.127 10.20.1.0 0.0.0.63 eq 443
 permit udp 10.20.2.128 0.0.0.127 10.20.1.0 0.0.0.63 eq 53
 permit icmp 10.20.2.128 0.0.0.127 10.20.1.0 0.0.0.63 echo
 deny ip 10.20.2.128 0.0.0.127 10.20.1.0 0.0.0.63
 deny ip 10.20.2.128 0.0.0.127 10.20.1.64 0.0.0.31
 permit ip 10.20.2.128 0.0.0.127 any
 deny ip any any
!
end
write memory
