enable
configure terminal
hostname HQ-RTR
!
! NetArchitect - HQ router: routing, WAN links, QoS
! Replace every CHANGE_ME_BEFORE_DEPLOY value before production use.
!
no ip domain-lookup
service password-encryption
ip domain-name netarchitect.local
enable secret CHANGE_ME_BEFORE_DEPLOY
username netadmin privilege 15 secret CHANGE_ME_BEFORE_DEPLOY
crypto key generate rsa modulus 2048
ip ssh version 2
!
interface GigabitEthernet0/0
 description DOWNLINK-TO-HQ-L3SW
 ip address 10.20.3.1 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
ip access-list extended QOS-CRITICAL
 permit ip any 10.20.1.0 0.0.0.63
 permit ip 10.20.1.0 0.0.0.63 any
class-map match-any VOICE
 match dscp ef
class-map match-any CRITICAL
 match access-group name QOS-CRITICAL
 match dscp af31 af41
policy-map WAN-QOS
 class VOICE
  priority percent 20
 class CRITICAL
  bandwidth percent 40
 class class-default
  fair-queue
!
interface GigabitEthernet0/1
 description EVPL-PHYSICAL-WAN_HQ_REMOTE_A_1
 no ip address
 service-policy output WAN-QOS
 no shutdown
!
interface GigabitEthernet0/1.203
 description EVPL-EVC-203-TO-REMOTE-A-RTR
 encapsulation dot1Q 203
 ip address 10.20.3.13 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet0/2
 description EVPL-PHYSICAL-WAN_HQ_REMOTE_A_2
 no ip address
 service-policy output WAN-QOS
 no shutdown
!
interface GigabitEthernet0/2.204
 description EVPL-EVC-204-TO-REMOTE-A-RTR
 encapsulation dot1Q 204
 ip address 10.20.3.17 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 100
 no shutdown
!
interface GigabitEthernet0/3
 description EVPL-PHYSICAL-WAN_HQ_REMOTE_B_1
 no ip address
 service-policy output WAN-QOS
 no shutdown
!
interface GigabitEthernet0/3.205
 description EVPL-EVC-205-TO-REMOTE-B-RTR
 encapsulation dot1Q 205
 ip address 10.20.3.21 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet0/4
 description EVPL-PHYSICAL-WAN_HQ_REMOTE_B_2
 no ip address
 service-policy output WAN-QOS
 no shutdown
!
interface GigabitEthernet0/4.206
 description EVPL-EVC-206-TO-REMOTE-B-RTR
 encapsulation dot1Q 206
 ip address 10.20.3.25 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 100
 no shutdown
!
router ospf 1
 router-id 10.255.1.2
 auto-cost reference-bandwidth 10000
 network 10.20.3.1 0.0.0.0 area 0
 network 10.20.3.13 0.0.0.0 area 1
 network 10.20.3.17 0.0.0.0 area 1
 network 10.20.3.21 0.0.0.0 area 2
 network 10.20.3.25 0.0.0.0 area 2
 area 1 range 10.20.2.0 255.255.255.128
 area 2 range 10.20.2.128 255.255.255.128
!
line console 0
 logging synchronous
 exec-timeout 10 0
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
write memory
