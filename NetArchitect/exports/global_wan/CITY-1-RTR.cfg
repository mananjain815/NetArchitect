enable
configure terminal
hostname CITY-1-RTR
!
! NetArchitect - CITY_1 router: routing, WAN links, IPsec
! Replace every CHANGE_ME_BEFORE_DEPLOY value before production use.
!
no ip domain-lookup
service password-encryption
ip domain-name netarchitect.local
enable secret CHANGE_ME_BEFORE_DEPLOY
username netadmin privilege 15 secret CHANGE_ME_BEFORE_DEPLOY
crypto key generate rsa modulus 2048
ip ssh version 2
!
interface GigabitEthernet0/0
 description DOWNLINK-TO-CITY-1-L3SW
 ip address 10.30.8.129 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
! --- IKE phase 1 / IPsec phase 2 ---
crypto isakmp policy 10
 encryption aes 256
 hash sha256
 authentication pre-share
 group 14
 lifetime 86400
! PACKET TRACER: use ' hash sha' and ' group 5' instead of sha256 / group 14
crypto ipsec transform-set TS-AES256 esp-aes 256 esp-sha256-hmac
 mode tunnel
! PACKET TRACER: use 'esp-aes 256 esp-sha-hmac'
!
access-list 101 permit ip 10.30.0.0 0.0.255.255 10.30.2.0 0.0.1.255
crypto isakmp key CHANGE_ME_BEFORE_DEPLOY address 10.30.8.150
crypto map VPN-1-CITY_2 10 ipsec-isakmp
 set peer 10.30.8.150
 set transform-set TS-AES256
 match address 101
!
interface GigabitEthernet0/1
 description WAN-TO-CITY-2-RTR
 ip address 10.30.8.149 255.255.255.252
 crypto map VPN-1-CITY_2
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
access-list 102 permit ip 10.30.0.0 0.0.255.255 10.30.2.0 0.0.1.255
crypto isakmp key CHANGE_ME_BEFORE_DEPLOY address 10.30.8.154
crypto map VPN-2-CITY_2 10 ipsec-isakmp
 set peer 10.30.8.154
 set transform-set TS-AES256
 match address 102
!
interface GigabitEthernet0/2
 description WAN-TO-CITY-2-RTR
 ip address 10.30.8.153 255.255.255.252
 crypto map VPN-2-CITY_2
 ip ospf network point-to-point
 ip ospf cost 100
 no shutdown
!
access-list 103 permit ip 10.30.0.0 0.0.255.255 10.30.4.0 0.0.1.255
crypto isakmp key CHANGE_ME_BEFORE_DEPLOY address 10.30.8.158
crypto map VPN-1-CITY_3 10 ipsec-isakmp
 set peer 10.30.8.158
 set transform-set TS-AES256
 match address 103
!
interface GigabitEthernet0/3
 description WAN-TO-CITY-3-RTR
 ip address 10.30.8.157 255.255.255.252
 crypto map VPN-1-CITY_3
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
access-list 104 permit ip 10.30.0.0 0.0.255.255 10.30.4.0 0.0.1.255
crypto isakmp key CHANGE_ME_BEFORE_DEPLOY address 10.30.8.162
crypto map VPN-2-CITY_3 10 ipsec-isakmp
 set peer 10.30.8.162
 set transform-set TS-AES256
 match address 104
!
interface GigabitEthernet0/4
 description WAN-TO-CITY-3-RTR
 ip address 10.30.8.161 255.255.255.252
 crypto map VPN-2-CITY_3
 ip ospf network point-to-point
 ip ospf cost 100
 no shutdown
!
access-list 105 permit ip 10.30.0.0 0.0.255.255 10.30.6.0 0.0.1.255
crypto isakmp key CHANGE_ME_BEFORE_DEPLOY address 10.30.8.166
crypto map VPN-1-CITY_4 10 ipsec-isakmp
 set peer 10.30.8.166
 set transform-set TS-AES256
 match address 105
!
interface GigabitEthernet0/5
 description WAN-TO-CITY-4-RTR
 ip address 10.30.8.165 255.255.255.252
 crypto map VPN-1-CITY_4
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
access-list 106 permit ip 10.30.0.0 0.0.255.255 10.30.6.0 0.0.1.255
crypto isakmp key CHANGE_ME_BEFORE_DEPLOY address 10.30.8.170
crypto map VPN-2-CITY_4 10 ipsec-isakmp
 set peer 10.30.8.170
 set transform-set TS-AES256
 match address 106
!
interface GigabitEthernet0/6
 description WAN-TO-CITY-4-RTR
 ip address 10.30.8.169 255.255.255.252
 crypto map VPN-2-CITY_4
 ip ospf network point-to-point
 ip ospf cost 100
 no shutdown
!
access-list 107 permit ip 10.30.0.0 0.0.255.255 10.30.8.0 0.0.0.127
crypto isakmp key CHANGE_ME_BEFORE_DEPLOY address 10.30.8.174
crypto map VPN-1-CLOUD_VPC 10 ipsec-isakmp
 set peer 10.30.8.174
 set transform-set TS-AES256
 match address 107
!
interface GigabitEthernet0/7
 description WAN-TO-CLOUD-VPC-RTR
 ip address 10.30.8.173 255.255.255.252
 crypto map VPN-1-CLOUD_VPC
 no shutdown
!
router ospf 1
 router-id 10.255.1.2
 auto-cost reference-bandwidth 10000
 network 10.30.8.129 0.0.0.0 area 0
 network 10.30.8.149 0.0.0.0 area 1
 network 10.30.8.153 0.0.0.0 area 1
 network 10.30.8.157 0.0.0.0 area 2
 network 10.30.8.161 0.0.0.0 area 2
 network 10.30.8.165 0.0.0.0 area 3
 network 10.30.8.169 0.0.0.0 area 3
 area 1 range 10.30.2.0 255.255.254.0
 area 2 range 10.30.4.0 255.255.254.0
 area 3 range 10.30.6.0 255.255.254.0
 redistribute bgp 65001 subnets
!
router bgp 65001
 bgp router-id 10.255.1.2
 bgp log-neighbor-changes
 neighbor 10.30.8.174 remote-as 65002
 neighbor 10.30.8.174 description EBGP-AS65002
 neighbor 10.30.8.174 prefix-list PL-OUT out
 neighbor 10.30.8.174 prefix-list PL-IN in
 network 10.30.0.0 mask 255.255.248.0
!
ip prefix-list PL-OUT seq 5 permit 10.30.0.0/21
ip prefix-list PL-IN seq 5 permit 10.30.8.0/25
ip route 10.30.0.0 255.255.248.0 Null0
! Null0 route anchors the aggregate so BGP can originate it (route summarisation)
!
line console 0
 logging synchronous
 exec-timeout 10 0
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
write memory
