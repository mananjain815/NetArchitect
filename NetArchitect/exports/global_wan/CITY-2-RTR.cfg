enable
configure terminal
hostname CITY-2-RTR
!
! NetArchitect - CITY_2 router: routing, WAN links, IPsec
! Replace every CHANGE_ME_BEFORE_DEPLOY value before production use.
!
no ip domain-lookup
service password-encryption
ip domain-name netarchitect.local
enable secret CHANGE_ME_BEFORE_DEPLOY
username netadmin privilege 15 secret CHANGE_ME_BEFORE_DEPLOY
crypto key generate rsa modulus 2048
ip ssh version 2
!
interface GigabitEthernet0/0
 description DOWNLINK-TO-CITY-2-L3SW
 ip address 10.30.8.133 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
! --- IKE phase 1 / IPsec phase 2 ---
crypto isakmp policy 10
 encryption aes 256
 hash sha256
 authentication pre-share
 group 14
 lifetime 86400
! PACKET TRACER: use ' hash sha' and ' group 5' instead of sha256 / group 14
crypto ipsec transform-set TS-AES256 esp-aes 256 esp-sha256-hmac
 mode tunnel
! PACKET TRACER: use 'esp-aes 256 esp-sha-hmac'
!
access-list 101 permit ip 10.30.2.0 0.0.1.255 10.30.0.0 0.0.255.255
crypto isakmp key CHANGE_ME_BEFORE_DEPLOY address 10.30.8.149
crypto map VPN-1-CITY_2 10 ipsec-isakmp
 set peer 10.30.8.149
 set transform-set TS-AES256
 match address 101
!
interface GigabitEthernet0/1
 description WAN-TO-CITY-1-RTR
 ip address 10.30.8.150 255.255.255.252
 crypto map VPN-1-CITY_2
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
access-list 102 permit ip 10.30.2.0 0.0.1.255 10.30.0.0 0.0.255.255
crypto isakmp key CHANGE_ME_BEFORE_DEPLOY address 10.30.8.153
crypto map VPN-2-CITY_2 10 ipsec-isakmp
 set peer 10.30.8.153
 set transform-set TS-AES256
 match address 102
!
interface GigabitEthernet0/2
 description WAN-TO-CITY-1-RTR
 ip address 10.30.8.154 255.255.255.252
 crypto map VPN-2-CITY_2
 ip ospf network point-to-point
 ip ospf cost 100
 no shutdown
!
router ospf 1
 router-id 10.255.2.2
 auto-cost reference-bandwidth 10000
 network 10.30.8.133 0.0.0.0 area 1
 network 10.30.8.150 0.0.0.0 area 1
 network 10.30.8.154 0.0.0.0 area 1
!
line console 0
 logging synchronous
 exec-timeout 10 0
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
write memory
