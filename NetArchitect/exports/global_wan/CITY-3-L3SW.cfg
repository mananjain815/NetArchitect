enable
configure terminal
hostname CITY-3-L3SW
!
! NetArchitect - CITY_3 multilayer switch: SVIs, RSTP, DHCP, ACLs, OSPF
! Replace every CHANGE_ME_BEFORE_DEPLOY value before production use.
!
no ip domain-lookup
service password-encryption
ip domain-name netarchitect.local
enable secret CHANGE_ME_BEFORE_DEPLOY
username netadmin privilege 15 secret CHANGE_ME_BEFORE_DEPLOY
crypto key generate rsa modulus 2048
ip ssh version 2
!
ip routing
!
spanning-tree mode rapid-pvst
spanning-tree vlan 30 priority 4096
!
vlan 999
 name NATIVE_UNUSED
vlan 30
 name CITY_3_IOT
!
ip dhcp excluded-address 10.30.4.1 10.30.4.10
ip dhcp pool CITY_3_IOT
 network 10.30.4.0 255.255.254.0
 default-router 10.30.4.1
!
interface Vlan30
 description GW-CITY_3_IOT
 ip address 10.30.4.1 255.255.254.0
 ip access-group ACL-CITY_3_IOT-IN in
 no shutdown
!
interface GigabitEthernet0/1
 description UPLINK-TO-CITY-3-RTR
 no switchport
 ip address 10.30.8.138 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
! --- ACL definitions (applied inbound on each SVI above) ---
ip access-list extended ACL-CITY_3_IOT-IN
 remark NetArchitect policy: role=iot subnet=10.30.4.0/23
 permit udp host 0.0.0.0 host 255.255.255.255 eq 67
 permit udp 10.30.4.0 0.0.1.255 host 10.30.4.1 eq 67
 permit udp 10.30.4.0 0.0.1.255 10.30.8.0 0.0.0.127 eq 53
 permit tcp 10.30.4.0 0.0.1.255 10.30.8.0 0.0.0.127 eq 443
 permit udp 10.30.4.0 0.0.1.255 10.30.8.0 0.0.0.127 eq 123
 permit tcp 10.30.4.0 0.0.1.255 10.30.8.0 0.0.0.127 eq 8883
 deny ip 10.30.4.0 0.0.1.255 10.30.0.0 0.0.255.255
 permit ip 10.30.4.0 0.0.1.255 any
 deny ip any any
!
router ospf 1
 router-id 10.255.3.1
 passive-interface default
 no passive-interface GigabitEthernet0/1
 auto-cost reference-bandwidth 10000
 network 10.30.4.0 0.0.1.255 area 2
 network 10.30.8.138 0.0.0.0 area 2
!
line console 0
 logging synchronous
 exec-timeout 10 0
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
write memory
