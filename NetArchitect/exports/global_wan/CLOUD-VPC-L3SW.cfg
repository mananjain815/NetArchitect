enable
configure terminal
hostname CLOUD-VPC-L3SW
!
! NetArchitect - CLOUD_VPC multilayer switch: SVIs, RSTP, DHCP, ACLs, OSPF
! Replace every CHANGE_ME_BEFORE_DEPLOY value before production use.
!
no ip domain-lookup
service password-encryption
ip domain-name netarchitect.local
enable secret CHANGE_ME_BEFORE_DEPLOY
username netadmin privilege 15 secret CHANGE_ME_BEFORE_DEPLOY
crypto key generate rsa modulus 2048
ip ssh version 2
!
ip routing
!
spanning-tree mode rapid-pvst
spanning-tree vlan 50 priority 4096
!
vlan 999
 name NATIVE_UNUSED
vlan 50
 name CLOUD_SERVICES
!
interface Vlan50
 description GW-CLOUD_SERVICES
 ip address 10.30.8.1 255.255.255.128
 ip access-group ACL-CLOUD_SERVICES-IN in
 no shutdown
!
interface GigabitEthernet0/1
 description UPLINK-TO-CLOUD-VPC-RTR
 no switchport
 ip address 10.30.8.146 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
! --- ACL definitions (applied inbound on each SVI above) ---
ip access-list extended ACL-CLOUD_SERVICES-IN
 remark NetArchitect policy: role=server subnet=10.30.8.0/25
 permit tcp 10.30.8.0 0.0.0.127 any established
 permit udp 10.30.8.0 0.0.0.127 eq 53 any
 permit icmp 10.30.8.0 0.0.0.127 any echo-reply
 deny ip any any
!
router ospf 1
 router-id 10.255.5.1
 passive-interface default
 no passive-interface GigabitEthernet0/1
 auto-cost reference-bandwidth 10000
 network 10.30.8.0 0.0.0.127 area 0
 network 10.30.8.146 0.0.0.0 area 0
!
line console 0
 logging synchronous
 exec-timeout 10 0
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
write memory
