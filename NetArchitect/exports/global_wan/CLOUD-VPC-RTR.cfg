enable
configure terminal
hostname CLOUD-VPC-RTR
!
! NetArchitect - CLOUD_VPC router: routing, WAN links, IPsec
! Replace every CHANGE_ME_BEFORE_DEPLOY value before production use.
!
no ip domain-lookup
service password-encryption
ip domain-name netarchitect.local
enable secret CHANGE_ME_BEFORE_DEPLOY
username netadmin privilege 15 secret CHANGE_ME_BEFORE_DEPLOY
crypto key generate rsa modulus 2048
ip ssh version 2
!
interface GigabitEthernet0/0
 description DOWNLINK-TO-CLOUD-VPC-L3SW
 ip address 10.30.8.145 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
! --- IKE phase 1 / IPsec phase 2 ---
crypto isakmp policy 10
 encryption aes 256
 hash sha256
 authentication pre-share
 group 14
 lifetime 86400
! PACKET TRACER: use ' hash sha' and ' group 5' instead of sha256 / group 14
crypto ipsec transform-set TS-AES256 esp-aes 256 esp-sha256-hmac
 mode tunnel
! PACKET TRACER: use 'esp-aes 256 esp-sha-hmac'
!
access-list 101 permit ip 10.30.8.0 0.0.0.127 10.30.0.0 0.0.255.255
crypto isakmp key CHANGE_ME_BEFORE_DEPLOY address 10.30.8.173
crypto map VPN-1-CLOUD_VPC 10 ipsec-isakmp
 set peer 10.30.8.173
 set transform-set TS-AES256
 match address 101
!
interface GigabitEthernet0/1
 description WAN-TO-CITY-1-RTR
 ip address 10.30.8.174 255.255.255.252
 crypto map VPN-1-CLOUD_VPC
 no shutdown
!
router ospf 1
 router-id 10.255.5.2
 auto-cost reference-bandwidth 10000
 network 10.30.8.145 0.0.0.0 area 0
 redistribute bgp 65002 subnets
!
router bgp 65002
 bgp router-id 10.255.5.2
 bgp log-neighbor-changes
 neighbor 10.30.8.173 remote-as 65001
 neighbor 10.30.8.173 description EBGP-AS65001
 neighbor 10.30.8.173 prefix-list PL-OUT out
 neighbor 10.30.8.173 prefix-list PL-IN in
 network 10.30.8.0 mask 255.255.255.128
!
ip prefix-list PL-OUT seq 5 permit 10.30.8.0/25
ip prefix-list PL-IN seq 5 permit 10.30.0.0/21
!
line console 0
 logging synchronous
 exec-timeout 10 0
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
write memory
